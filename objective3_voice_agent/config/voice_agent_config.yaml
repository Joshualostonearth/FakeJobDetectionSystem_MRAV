# ============================================================
# voice_agent_config.yaml
# All non-secret configuration for Objective 3.
# API keys must NEVER appear here — they live in .env only.
# ============================================================

# --- Server ---
use_ngrok: false
server_port: 8765
webrtc_bridge_url: "http://localhost:5000"
public_base_url: "http://localhost:8765"

# --- Voice Selection ---
voice_india: "en-IN-NeerjaNeural"
voice_us: "en-US-AriaNeural"
voice_uk: "en-GB-SoniaNeural"
voice_fallback: "en-US-JennyNeural"

# --- Whisper ---
whisper_model_size: "base"
whisper_device: "cpu"
whisper_compute_type: "int8"

# --- LLM ---
# Overridden by the OLLAMA_MODEL environment variable when set
ollama_model: "ministral-3"

# --- Timeouts (seconds) ---
call_ring_timeout: 30
call_max_duration: 120
recording_timeout: 600           # whole call: 10 questions, each answered + processed by the LLM
session_start_timeout: 300      # question generation on the local LLM
